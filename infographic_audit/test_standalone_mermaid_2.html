<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mermaid 11.17.2 Standalone Audit Test</title>
  <script src="../frontend/node_modules/mermaid/dist/mermaid.min.js"></script>
</head>
<body>
  <h1>Mermaid Standalone Test</h1>
  <div id="output"></div>
  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += msg + '\n';
      console.log(msg);
    }

    const mmdCode = `flowchart TD
  subgraph Stage1 ["🌱 1. Cellular Ingestion & Fuel Supply"]
    A(["🍇 Glucose<br/><i>Nutrient Fuel Source</i>"])
    B(["🫁 Oxygen (O₂)<br/><i>Inhaled Gas Catalyst</i>"])
  end

  subgraph Stage2 ["⚙️ 2. Mitochondrial Power Plant"]
    direction TB
    C["🔬 Cellular Respiration<br/><i>Chemical Oxidation Engine</i>"]
    E{{ "⚡ Bond Cleavage<br/><i>High-Energy Yield Check</i>" }}
    D[("🗄️ ATP Battery Bank<br/><i>Charged Chemical Energy</i>")]
    F["🌫️ Metabolic Byproducts<br/><i>CO₂ & Water Excretion</i>"]

    C -->|"Feeds Chemical Reaction"| E
    E -->|"Packs Energy Into"| D
    C -->|"Generates Exhaust"| F
  end

  subgraph Stage3 ["🚀 3. Physiological Work & Impact"]
    G(["💪 Muscle Contraction<br/><i>Physical Movement & Force</i>"])
    H(["🫀 Cardiac Rhythm<br/><i>Continuous Heartbeat Pumping</i>"])
    I(["🧠 Neural Transmission<br/><i>Brain Signal & Cognition</i>"])
  end

  A -->|"Delivers Carbon Fuel"| C
  B -->|"Enables Cellular Respiration"| C
  D ==>|"Discharges Power"| G
  D ==>|"Sustains Function"| H
  D ==>|"Fuels Synapses"| I`;

    async function runTest() {
      try {
        log('Mermaid version: ' + (mermaid.version ? mermaid.version() : 'loaded'));
        mermaid.initialize({
          startOnLoad: false,
          theme: 'base',
          themeVariables: {
            darkMode: true,
            background: 'transparent',
            primaryColor: '#0F1420',
            primaryTextColor: '#F8FAFC',
            primaryBorderColor: '#38BDF8',
            lineColor: '#64748B',
            secondaryColor: '#161324',
            tertiaryColor: '#0D1929',
            edgeLabelBackground: '#0F1420',
            clusterBkg: 'rgba(12, 17, 32, 0.72)',
            clusterBorder: 'rgba(56, 189, 248, 0.28)',
            fontFamily: 'var(--font-outfit), sans-serif',
            fontSize: '13px',
            nodeBorder: 'solid'
          },
          securityLevel: 'loose',
          flowchart: {
            htmlLabels: true,
            curve: 'basis',
            useMaxWidth: false,
            nodeSpacing: 50,
            rankSpacing: 65,
            padding: 18
          }
        });

        log('Running mermaid.parse...');
        const parseRes = await mermaid.parse(mmdCode);
        log('Parse result: ' + JSON.stringify(parseRes));

        log('Running mermaid.render...');
        const { svg } = await mermaid.render('test_render_id', mmdCode);
        log('Render SUCCESS! SVG length: ' + svg.length);
        document.getElementById('output').innerHTML = svg;
        const svgEl = document.querySelector('svg');
        log('SVG viewBox: ' + svgEl.getAttribute('viewBox'));
        log('SVG width: ' + svgEl.getAttribute('width') + ', height: ' + svgEl.getAttribute('height'));
        window.__TEST_DONE__ = true;
      } catch (err) {
        log('ERROR THROWN: ' + err.message);
        log('ERROR NAME: ' + err.name);
        log('ERROR STACK: ' + err.stack);
        window.__TEST_DONE__ = true;
      }
    }

    runTest();
  </script>
</body>
</html>
